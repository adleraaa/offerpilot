llm:
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  daily_spend_cap_usd: 2.0
  prices:
    deepseek-v4-flash:
      input_cache_hit_per_mtok_usd: 0.007
      input_cache_miss_per_mtok_usd: 0.22
      output_per_mtok_usd: 0.66
      peak_multiplier: 2.0
    deepseek-v4-pro:
      input_cache_hit_per_mtok_usd: 0.022
      input_cache_miss_per_mtok_usd: 0.66
      output_per_mtok_usd: 1.98
      peak_multiplier: 2.0
match:
  score_threshold: 60
  max_auto_retries: 3
brief:
  enabled: true
panel:
  host: 127.0.0.1
  port: 8000
eval:
  results_dir: evals/results
  precision_at:
  - 5
  - 10
# Real, public ATS boards, verified reachable on 2026-08-20. They are a
# starting point so `collect` works on a fresh clone, not a recommendation --
# the eval showed the corpus matters more than the model, and these boards are
# only as useful as their overlap with what you are actually looking for.
# One Lever board is included so both collectors are exercised.
companies:
- id: figma
  name: Figma
  ats: greenhouse
  ats_slug: figma
- id: datadog
  name: Datadog
  ats: greenhouse
  ats_slug: datadog
- id: databricks
  name: Databricks
  ats: greenhouse
  ats_slug: databricks
- id: samsara
  name: Samsara
  ats: greenhouse
  ats_slug: samsara
- id: ro
  name: Ro
  ats: lever
  ats_slug: ro
