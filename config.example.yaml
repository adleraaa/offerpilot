llm:
  base_url: https://api.deepseek.com
  # deepseek-chat is a legacy alias: a 2026-08-20 probe requested it and the
  # response came back as deepseek-v4-flash. Pin the real name so the price
  # key, the requested model and the served model all agree.
  model: deepseek-v4-flash
  daily_spend_cap_usd: 2.00
  # https://api-docs.deepseek.com/quick_start/pricing/ (checked 2026-08-20).
  # Off-peak rates; peak (01:00-04:00 and 06:00-10:00 UTC) is 2x.
  prices:
    deepseek-v4-flash:
      input_cache_hit_per_mtok_usd: 0.007
      input_cache_miss_per_mtok_usd: 0.22
      output_per_mtok_usd: 0.66
      peak_multiplier: 2.0
    deepseek-v4-pro:
      input_cache_hit_per_mtok_usd: 0.022
      input_cache_miss_per_mtok_usd: 0.66
      output_per_mtok_usd: 1.98
      peak_multiplier: 2.0
match:
  score_threshold: 60
  max_auto_retries: 3
brief:
  enabled: true
panel:
  host: 127.0.0.1
  port: 8000
eval:
  results_dir: evals/results
  precision_at: [5, 10]
companies:
  - id: examplecorp
    name: ExampleCorp
    ats: greenhouse
    ats_slug: examplecorp
  - id: samplestartup
    name: SampleStartup
    ats: lever
    ats_slug: samplestartup
