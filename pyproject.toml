[project]
name = "offerpilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "requests>=2.32",
  "PyYAML>=6.0",
  "openai>=1.40",
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"offerpilot.panel" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several tests import `tests.conftest` helpers. `python -m pytest`
# puts the repo root on sys.path and a bare `pytest` does not, so
# without this the first command a reader tries aborts on collection.
pythonpath = ["."]
