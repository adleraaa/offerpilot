name: tests

on:
  # Every branch, not just main. The work happens on feature branches,
  # so a main-only trigger meant a push ran nothing while the README
  # promised the suite ran on every push.
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # v5/v6 run on Node 24. Node 20 leaves the runners on
      # 2026-09-16, and these are the two actions that would
      # have taken the badge red without anyone touching the repo.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # A separate step, not a pytest plugin: a lint failure and a test
      # failure are different news, and the job summary should say which.
      - run: python -m ruff check .
      - run: python -m pytest -q
